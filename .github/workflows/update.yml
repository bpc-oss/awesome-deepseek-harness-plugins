name: Update plugin snapshot

on:
  schedule:
    - cron: "17 3 * * *"   # daily, off-peak UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh PLUGINS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_plugins.py > PLUGINS.md
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PLUGINS.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh plugin snapshot"
            git push
          fi
